# Local development stack for zimasa-zcare-service.
# Run from the project root so the credentials come from .env (git-ignored):
#   docker compose --env-file .env -f deploy/compose.yaml up -d --wait
# PostgreSQL listens on host port 5433, leaving 5432 free for a native install.
name: zimasa-zcare-service

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_ADMIN_USERNAME:?set DB_ADMIN_USERNAME in .env}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?set DB_ADMIN_PASSWORD in .env}
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres16-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres16-data:
