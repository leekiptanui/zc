# zimasa-zcare-service configuration. Production-safe defaults; every environment-specific value
# comes from an environment variable (CFG-01..06). Variables are listed in .env.example.
spring:
  application:
    name: zimasa-zcare-service
  # The service connects as zc_app, which owns nothing and cannot bypass row-level security.
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME:zc_app}
    password: ${DB_PASSWORD}
  # Migrations run as the schema owner, never as zc_app (04D section 12.4).
  liquibase:
    change-log: classpath:db/changelog/changelog-master.xml
    enabled: ${DB_MIGRATE_ON_STARTUP:true}
    url: ${DB_URL}
    user: ${DB_MIGRATION_USERNAME}
    password: ${DB_MIGRATION_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

zcare:
  security:
    jwt:
      issuer-uri: ${KEYCLOAK_ISSUER_URI:}
      jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:}
      audience: ${KEYCLOAK_AUDIENCE:zimasa-zcare-service}
      # Local runs and tests only. Never set in a deployed environment.
      hmac-secret: ${ZCARE_JWT_HMAC_SECRET:}
    claims:
      tenant: ${ZCARE_TENANT_CLAIM:tenant}
      organisation: ${ZCARE_ORGANISATION_CLAIM:org}

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"
